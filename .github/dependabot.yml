version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - minor
          - patch
