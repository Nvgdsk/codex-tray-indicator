name: Bug report
description: Report a reproducible problem with Codex Tray Indicator.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for non-security bugs. For vulnerabilities, follow SECURITY.md
        in the repository root and report privately.
        Never attach prompts, responses, transcripts, certificate material, secrets,
        credentials, or unsanitized logs/screenshots.
        The indicator does not produce runtime conversation logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and read the troubleshooting guide in README.md.
          required: true
        - label: I removed private data and am not disclosing a security vulnerability publicly.
          required: true
  - type: input
    id: app-version
    attributes:
      label: App version and installation method
      description: Include the release version and whether you used the installer or portable EXE.
      placeholder: "1.3.0, installer"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11, x64, OS build number"
    validations:
      required: true
  - type: input
    id: wsl-distribution
    attributes:
      label: WSL version and selected distribution
      description: State WSL1/WSL2, distribution name/version, and whether Codex exists in several distributions.
      placeholder: "WSL2, Ubuntu; one Codex installation"
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: Run codex --version inside the selected WSL distribution.
      placeholder: "codex-cli 0.154.0"
    validations:
      required: true
  - type: input
    id: usb-hardware
    attributes:
      label: USB hardware, if applicable
      description: Include screen model/revision, COM port and orientation. Do not include private device identifiers.
      placeholder: "No screen, or Turing 3.5-inch Revision A / COM3 / Portrait"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use lifecycle events and actions, not prompt or response contents.
      placeholder: |
        1. Launch the tray.
        2. Start a new trusted Codex session in the selected WSL distribution.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the expected tray state, notification or USB behavior.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Include observed states and whether /hooks Trust was completed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics, if available
      description: Include --query-state output or redacted setup/build errors. Do not paste full configuration, transcripts or private paths.
      render: text
    validations:
      required: false
