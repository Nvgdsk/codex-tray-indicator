name: Windows CI

"on":
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  CODEXTRAY_TEST_USB_PORT: ""

defaults:
  run:
    shell: pwsh

jobs:
  quality:
    name: Locked Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned SDK and NuGet cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify selected SDK
        run: |
          $expectedSdk = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          $selectedSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $selectedSdk -ne $expectedSdk) {
            throw "Selected SDK '$selectedSdk' does not match pinned SDK '$expectedSdk'."
          }

      - name: Restore locked packages
        run: dotnet restore ./CodexTray.sln --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Verify repository contract
        run: ./scripts/test-repository-contract.ps1

      - name: Verify formatting
        run: dotnet format ./CodexTray.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build ./CodexTray.sln --configuration Release --no-restore

      - name: Test without real WSL or USB hardware
        run: dotnet test ./CodexTray.sln --configuration Release --no-build --no-restore --filter 'Category!=Integration&Category!=UsbHardware' --results-directory TestResults -- --report-xunit-trx --report-xunit-trx-filename ci.trx

      - name: Audit direct and transitive dependencies
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Assert-SafeAuditReport {
            param([AllowNull()][object]$Value)

            if ($null -eq $Value) {
              return
            }
            if ($Value -is [Array]) {
              foreach ($item in $Value) {
                Assert-SafeAuditReport $item
              }
              return
            }
            if ($Value -is [pscustomobject]) {
              foreach ($property in $Value.PSObject.Properties) {
                $nonemptyValues = @($property.Value | Where-Object { $null -ne $_ })
                if ($property.Name -eq 'vulnerabilities' -and $nonemptyValues.Count -gt 0) {
                  throw 'Known dependency vulnerabilities found; review the audit report.'
                }
                if ($property.Name -in @('problems', 'errors') -and $nonemptyValues.Count -gt 0) {
                  throw 'Dependency audit reported problems; do not treat an incomplete audit as clean.'
                }
                Assert-SafeAuditReport $property.Value
              }
            }
          }

          $auditOutput = dotnet list ./CodexTray.sln package --vulnerable --include-transitive --format json --output-version 1 --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency audit failed with exit code $LASTEXITCODE."
          }
          $auditJson = $auditOutput -join [Environment]::NewLine
          Write-Output $auditJson
          $report = $auditJson | ConvertFrom-Json
          if ($report.version -ne 1 -or @($report.projects).Count -eq 0 -or @($report.sources).Count -eq 0) {
            throw 'Dependency audit did not return a complete version-1 report.'
          }
          Assert-SafeAuditReport $report

      - name: Upload test reports only on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
